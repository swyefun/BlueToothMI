name: build

# 构建 BlueToothMI 模块：检出 pin 版 Canopus 工具链，覆盖模块后走
# canopus build -> verify -> package，产物上传到 Actions Artifacts。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CANOPUS_SHA: f196b200823f47780c73ae48c4c62da8fe5311df
  TARGET_ID: xiaomi-band-11-4.100.179

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Canopus toolchain (pinned, anonymous)
        run: |
          git clone --quiet https://github.com/AstralSightStudios/Canopus.git canopus
          git -C canopus checkout --quiet --detach "$CANOPUS_SHA"

      - name: Install Rust (stable + thumbv8m.main-none-eabi)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabi

      - name: Install LLVM toolchain (clang, ld.lld, llvm-ar)
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Overlay module into Canopus tree
        run: cp -r modules/headset-link-179 canopus/modules/

      - name: Build canopus CLI
        working-directory: canopus
        run: cargo build --release -p canopus-cli

      - name: Doctor
        working-directory: canopus
        run: target/release/canopus doctor

      - name: Build module
        working-directory: canopus/modules/headset-link-179
        run: |
          ../../target/release/canopus build
          ../../target/release/canopus package

      - name: Verify ELF against target pack
        working-directory: canopus
        run: |
          elf=$(find modules/headset-link-179/build -name '*.elf' | head -1)
          echo "verifying $elf"
          target/release/canopus verify "$elf" --target "$TARGET_ID" --targets-dir targets

      - name: Collect artifacts
        run: |
          mkdir -p out
          find canopus/modules/headset-link-179 -type f \
            \( -name '*.elf' -o -name '*.canopus' \) -not -path '*/build/cargo/*' -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: headset-link-179-${{ github.sha }}
          path: out/
          if-no-files-found: error
