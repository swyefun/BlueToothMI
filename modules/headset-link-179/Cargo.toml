[package]
name = "headset_link_179"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
rust-version = "1.88"
description = "Xiaomi Band 11 (4.100.179) headset link front-end"

[lib]
name = "headset_link_179"
path = "src/lib.rs"
crate-type = ["staticlib"]

# `canopus build` passes --no-default-features --features device and adds
# canopus-target-private/target-xiaomi-band-11-4-100-179 for the exact pack.
[features]
default = []
device = ["dep:canopus-target-private"]

[dependencies]
canopus-abi = { path = "../../sdk/rust/canopus-abi" }
canopus-runtime = { path = "../../sdk/rust/canopus-runtime" }
canopus-target-private = { path = "../../sdk/rust/canopus-target-private", optional = true, default-features = false }

# MP3 soft-decode (minimp3) + SBC encode dependency probe.
# rmp3's default `simd` feature must stay OFF: its build.rs only defines
# MINIMP3_NO_SIMD when the feature is absent, and Cortex-M33 has no NEON.
# `canopus build` already injects CC/AR/CFLAGS for thumbv8m.main-none-eabi
# (cli/canopus/src/project.rs), so minimp3.c cross-compiles with clang.
rmp3 = { version = "0.3.1", default-features = false }
nanoaudio-sbc = { version = "0.1.1", default-features = false }
nanoaudio-core = { version = "0.1.1", default-features = false }

[profile.release]
panic = "abort"
opt-level = "z"
lto = "thin"
codegen-units = 1

# Standalone crate: do not join the repository root workspace.
[workspace]
